<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background rounded rect -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="150" y1="512" x2="874" y2="512" stroke="#1e40af" stroke-width="1" opacity="0.3"/>
  <line x1="512" y1="150" x2="512" y2="874" stroke="#1e40af" stroke-width="1" opacity="0.3"/>

  <!-- Path diagram: 3 latent variable nodes -->
  <!-- X (exogenous) → left -->
  <!-- M (mediator) → top right -->
  <!-- Y (endogenous) → bottom right -->

  <!-- Arrows (paths) -->
  <!-- X → Y -->
  <line x1="288" y1="512" x2="680" y2="668" stroke="#38bdf8" stroke-width="10" marker-end="url(#arrow)" opacity="0.9"/>
  <!-- X → M -->
  <line x1="288" y1="490" x2="650" y2="336" stroke="#38bdf8" stroke-width="10" marker-end="url(#arrow)" opacity="0.9"/>
  <!-- M → Y -->
  <line x1="720" y1="380" x2="720" y2="640" stroke="#38bdf8" stroke-width="10" marker-end="url(#arrow)" opacity="0.9"/>

  <!-- Indicator tick marks on X -->
  <line x1="175" y1="430" x2="230" y2="480" stroke="#94a3b8" stroke-width="6" opacity="0.6"/>
  <line x1="175" y1="512" x2="230" y2="512" stroke="#94a3b8" stroke-width="6" opacity="0.6"/>
  <line x1="175" y1="594" x2="230" y2="544" stroke="#94a3b8" stroke-width="6" opacity="0.6"/>

  <!-- Node X -->
  <ellipse cx="260" cy="512" rx="62" ry="62" fill="#0f172a" stroke="#38bdf8" stroke-width="6"/>
  <text x="260" y="520" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">X</text>

  <!-- Node M -->
  <ellipse cx="720" cy="340" rx="62" ry="62" fill="#0f172a" stroke="#38bdf8" stroke-width="6"/>
  <text x="720" y="348" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">M</text>

  <!-- Node Y -->
  <ellipse cx="720" cy="700" rx="62" ry="62" fill="#0f172a" stroke="#38bdf8" stroke-width="6"/>
  <text x="720" y="708" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">Y</text>

  <!-- FreePLS text -->
  <text x="512" y="880" font-family="'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="800" fill="white" text-anchor="middle" letter-spacing="2">Free<tspan fill="#38bdf8">PLS</tspan></text>
</svg>

